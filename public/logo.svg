<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 256" width="900" height="256" role="img" aria-label="Neon Wardens">
  <title>Neon Wardens</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@800&amp;family=Share+Tech+Mono&amp;display=swap');
    .w { font-family: Orbitron, 'Eurostile', 'Arial Black', sans-serif; font-weight: 800; letter-spacing: 6px; }
    .t { font-family: 'Share Tech Mono', ui-monospace, Menlo, monospace; letter-spacing: 7px; }</style>
  <rect width="900" height="256" rx="28" fill="#07071a"/>
  <g transform="translate(14 14) scale(0.89)"><defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff"/><stop offset="0.45" stop-color="#7ff8ff"/><stop offset="1" stop-color="#00c8e0"/></radialGradient>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="#1a1440"/><stop offset="1" stop-color="#07071a"/></radialGradient>
    <linearGradient id="g-water-fire" gradientUnits="userSpaceOnUse" x1="57.6" y1="105.1" x2="198.4" y2="105.1"><stop offset="0" stop-color="#00e5ff"/><stop offset="1" stop-color="#ff5a36"/></linearGradient><linearGradient id="g-fire-metal" gradientUnits="userSpaceOnUse" x1="198.4" y1="105.1" x2="84.5" y2="187.9"><stop offset="0" stop-color="#ff5a36"/><stop offset="1" stop-color="#c9d1ff"/></linearGradient><linearGradient id="g-metal-wood" gradientUnits="userSpaceOnUse" x1="84.5" y1="187.9" x2="128.0" y2="54.0"><stop offset="0" stop-color="#c9d1ff"/><stop offset="1" stop-color="#39ff88"/></linearGradient><linearGradient id="g-wood-earth" gradientUnits="userSpaceOnUse" x1="128.0" y1="54.0" x2="171.5" y2="187.9"><stop offset="0" stop-color="#39ff88"/><stop offset="1" stop-color="#ffb020"/></linearGradient><linearGradient id="g-earth-water" gradientUnits="userSpaceOnUse" x1="171.5" y1="187.9" x2="57.6" y2="105.1"><stop offset="0" stop-color="#ffb020"/><stop offset="1" stop-color="#00e5ff"/></linearGradient>
