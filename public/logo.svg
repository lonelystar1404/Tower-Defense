  <g stroke="url(#frame)" stroke-width="4" stroke-linecap="round" opacity="0.9"><line x1="128.0" y1="24.0" x2="128.0" y2="10.0"/><line x1="218.1" y1="76.0" x2="230.2" y2="69.0"/><line x1="218.1" y1="180.0" x2="230.2" y2="187.0"/><line x1="128.0" y1="232.0" x2="128.0" y2="246.0"/><line x1="37.9" y1="180.0" x2="25.8" y2="187.0"/><line x1="37.9" y1="76.0" x2="25.8" y2="69.0"/></g>
