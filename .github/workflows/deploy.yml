name: Deploy to GitHub Pages

on:
  push:
    branches: [main]      # deploy on every push to main
  workflow_dispatch:      # adds a "Run workflow" button on GitHub

permissions:
  contents: read
  pages: write            # needed to publish to Pages
  id-token: write         # needed to prove the deploy came from this repo

concurrency:
  group: pages
  cancel-in-progress: true   # a newer push cancels an older deploy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci           # clean install from package-lock.json
      - run: npm run build    # tsc + vite build -> dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
